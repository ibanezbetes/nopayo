<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--=============== FAVICON ===============-->
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />

  <!--=============== REMIXICONS ===============-->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.0.1/remixicon.min.css"/>

  <!--=============== SWIPER CSS ===============-->
  <link rel="stylesheet" href="assets/css/swiper-bundle.min.css" />

  <!--=============== ESTILOS ===============-->
  <link rel="stylesheet" href="assets/css/styles.css" />

  <title>NOPAYO · Inicio</title>
</head>
<body>
  <!--==================== HEADER ====================-->
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">
        <img src="images/logo.png" alt="NOPAYO · Inicio">
      </a>

      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list">
          <li class="nav__item"><a href="camisetas.html" class="nav__link">Camisetas</a></li>
          <li class="nav__item"><a href="sudaderas.html" class="nav__link">Sudaderas</a></li>
          <li class="nav__item"><a href="otros.html" class="nav__link">Otros</a></li>
          <li class="nav__item"><a href="gallery.html" class="nav__link">Galería</a></li>
          <li class="nav__item" id="nav-login">
            <a href="#" class="nav__link">Iniciar sesión</a>
          </li>
          <li class="nav__item hidden" id="nav-logout">
            <a href="#" class="nav__link">Cerrar sesión</a>
          </li>
          <li class="nav__item hidden" id="nav-account">
            <a href="account.html" class="nav__link">Mi cuenta</a>
          </li>
        </ul>
        <div class="nav__close" id="nav-close"><i class="ri-close-line"></i></div>
      </div>

      <div class="nav__actions">
        <a href="cart.html"><i class="ri-shopping-cart-line"></i></a>
        <div class="nav__toggle" id="nav-toggle"><i class="ri-menu-line"></i></div>
      </div>
    </nav>
  </header>

  <!--==================== MAIN / SWIPER ====================-->
  <main class="main">
    <section class="home">
      <div class="home__container container">
        <div class="home__content">
          <div class="home__circle">
            <div class="home__subcircle"></div>
            <img src="images/LOGO-PATAS_CRUZADAS_yellow.png"
                 alt="NOPAYO"
                 class="home__title-img" />
          </div>

          <div class="home__swiper swiper">
            <div class="swiper-wrapper" id="home-swiper-wrapper"></div>
          </div>

          <div class="swiper-button-prev"><i class="ri-arrow-left-line"></i></div>
          <div class="swiper-button-next"><i class="ri-arrow-right-line"></i></div>
        </div>

        <footer class="home__footer">
          <div class="home__social">
            <a href="mailto:nopayo.es@gmail.com" class="home__social-link">
              <i class="ri-mail-line"></i>
            </a>
            <a href="https://www.instagram.com/nopayo.es"
               class="home__social-link"
               target="_blank">
              <i class="ri-instagram-line"></i>
            </a>
            <a href="https://wa.me/15514058519"
               class="home__social-link"
               target="_blank">
              <i class="ri-whatsapp-line"></i>
            </a>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <!--==================== MODAL PRODUCTO ====================-->
  <div id="product-modal" class="modal hidden">
    <div class="modal__backdrop" id="modal-backdrop"></div>
    <div class="modal__box">
      <button class="modal__close" id="modal-close">
        <i class="ri-close-line"></i>
      </button>
      <div class="modal__gallery">
        <img id="modal-main-img" class="modal__main-img" src="#" alt="">
        <div class="modal__thumbs" id="modal-thumbs"></div>
      </div>
      <div class="modal__info">
        <h2 id="modal-name" data-product-id=""></h2>
        <p id="modal-description"></p>
        <label for="modal-size">Talla:</label>
        <select id="modal-size">
          <option value="">Selecciona…</option>
          <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
        </select>
        <p class="modal__price">Precio: €<span id="modal-price"></span></p>
        <div class="modal__buttons">
          <button id="modal-cart" class="modal__icon">
            <i class="ri-shopping-cart-line"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!--=============== SCRIPTS ===============-->
  <script src="assets/js/swiper-bundle.min.js"></script>
  <script type="module" src="assets/js/home.js"></script>
  <script src="assets/js/menu.js"></script>
</body>
</html>
