<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--=============== FAVICON ===============-->
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
  <!--=============== REMIXICONS ===============-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.0.1/remixicon.min.css" />
  <!--=============== ESTILOS ===============-->
  <link rel="stylesheet" href="assets/css/styles.css" />
  <title>Nopayo — Checkout</title>
  <style>
    .main { padding-top: calc(var(--header-height) + 2rem); }
    .checkout { padding-block: 4rem 2rem; background: var(--first-color); color: var(--black-color); }
    .checkout__container { display: grid; grid-template-columns: repeat(2,1fr); gap:2rem; }
    .checkout__title { font-family: var(--body-font); font-weight: var(--font-semi-bold); color: var(--accent-color); text-align:center; font-size: var(--h2-font-size); margin-bottom:2rem; }
    .checkout__card { background: var(--accent-color); padding:1.5rem; border-radius:8px; }
    .checkout__summary h2, .checkout__form h2 { font-family: var(--body-font); font-weight: var(--font-semi-bold); color: var(--first-color); margin-bottom:1rem; }
    .checkout__summary ul { list-style:none; margin:0; padding:0; }
    .checkout__summary li { display:flex; justify-content:space-between; margin-bottom:1rem; border-bottom:1px solid rgba(0,0,0,0.1); padding-bottom:0.5rem; }
    .checkout__summary .total { font-weight:var(--font-semi-bold); font-size:var(--h3-font-size); margin-top:1rem; display:flex; justify-content:space-between; }
    .checkout__form .form-group { margin-bottom:1rem; }
    .checkout__form label { display:block; margin-bottom:0.5rem; font-weight:var(--font-semi-bold); font-family:var(--body-font); color:var(--black-color); }
    .checkout__form input { width:100%; padding:0.75rem 1rem; border:1px solid rgba(0,0,0,0.1); border-radius:4px; font-family:var(--body-font); font-size:var(--normal-font-size); }
    .checkout__form .checkbox-group { display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem; }
    .checkout__actions { grid-column:1/-1; display:flex; justify-content:center; margin-top:2rem; }
    .btn-order { background: var(--first-color); color: var(--accent-color); border:none; padding:0.75rem 1.5rem; border-radius:4px; font-family:var(--body-font); font-weight:var(--font-semi-bold); cursor:pointer; transition: background-color .3s; }
    .btn-order:hover { background: var(--first-color-lighten); }
    @media(max-width:1150px){ .checkout__container { grid-template-columns:1fr; } }
  </style>
  <!-- AWS Amplify CDN -->
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@4.4.4/dist/aws-amplify.min.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">
        <img src="images/logo.png" alt="NOPAYO — Inicio">
      </a>

      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list">
          <li class="nav__item"><a href="camisetas.html" class="nav__link">Camisetas</a></li>
          <li class="nav__item"><a href="sudaderas.html" class="nav__link">Sudaderas</a></li>
          <li class="nav__item"><a href="otros.html" class="nav__link">Otros</a></li>
          <li class="nav__item"><a href="gallery.html" class="nav__link">Galería</a></li>
          <li class="nav__item" id="nav-login">
            <a href="#" class="nav__link">Iniciar sesión</a>
          </li>
          <li class="nav__item hidden" id="nav-logout">
            <a href="#" class="nav__link">Cerrar sesión</a>
          </li>
          <li class="nav__item hidden" id="nav-account">
            <a href="account.html" class="nav__link">Mi cuenta</a>
          </li>
        </ul>
        <div class="nav__close" id="nav-close"><i class="ri-close-line"></i></div>
      </div>

      <div class="nav__actions">
        <a href="cart.html"><i class="ri-shopping-cart-line"></i></a>
        <div class="nav__toggle" id="nav-toggle"><i class="ri-menu-line"></i></div>
      </div>
    </nav>
  </header>

  <!-- Main -->
  <main class="main">
    <section class="checkout">
      <h1 class="checkout__title">Proceso de Pedido</h1>
      <div class="checkout__container container">
        <!-- Resumen de carrito -->
        <div class="checkout__card checkout__summary">
          <h2>Tu carrito (<span id="checkout-summary-count">0</span>)</h2>
          <ul id="checkout-summary-list"></ul>
          <div class="total">
            <span>Total</span>
            <span>€<span id="checkout-summary-total">0.00</span></span>
          </div>
        </div>
        <!-- Formulario de facturación -->
        <div class="checkout__card checkout__form">
          <h2>Dirección de Facturación</h2>
          <div class="form-group">
            <label for="firstName">Nombre</label>
            <input type="text" id="firstName" required/>
          </div>
          <div class="form-group">
            <label for="lastName">Apellidos</label>
            <input type="text" id="lastName" required/>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required/>
          </div>
          <div class="form-group">
            <label for="address">Dirección</label>
            <input type="text" id="address" required/>
          </div>
          <div class="form-group">
            <label for="postalCode">Código Postal</label>
            <input type="text" id="postalCode" required/>
          </div>
          <div class="form-group">
            <label for="locality">Localidad</label>
            <input type="text" id="locality" required/>
          </div>
          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input type="tel" id="phone" required/>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="sameAddress" checked/>
            <label for="sameAddress">La dirección de envío es igual</label>
          </div>
        </div>
        <!-- Botón de crear pedido -->
        <!--<div class="checkout__actions">
          <button class="btn-order" id="place-order-btn">Realizar Pedido</button>
        </div>-->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="home__footer">
    <div class="home__social">
      <a href="mailto:nopayo.es@gmail.com" class="home__social-link">
        <i class="ri-mail-line"></i>
      </a>
      <a href="https://www.instagram.com/nopayo.es"
         class="home__social-link"
         target="_blank">
        <i class="ri-instagram-line"></i>
      </a>
      <a href="https://wa.me/15514058519"
         class="home__social-link"
         target="_blank">
        <i class="ri-whatsapp-line"></i>
      </a>
    </div>
  </footer>

  <!-- Lógica de menú, carrito y pedido -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    // ——— Toggle menú ———
    const navToggle = document.getElementById('nav-toggle');
    const navMenu   = document.getElementById('nav-menu');
    if (navToggle && navMenu) {
      navToggle.addEventListener('click', () => {
        navMenu.classList.toggle('show-menu');
      });
    }

    // ——— Configurar AWS Amplify ———
    const awsconfig = {
      aws_cognito_region: "us-east-1",
      aws_user_pools_id: "us-east-1_RiJ4pDIaa",
      aws_user_pools_web_client_id: "6l7mg3kafjuugr1op4f83j8udv",
      aws_cloud_logic_custom: [
        {
          name: "ordersApi",
          endpoint: "https://xi7qwmpqs1.execute-api.us-east-1.amazonaws.com/dev",
          region: "us-east-1"
        }
      ]
    };
    if (window.Amplify?.configure) {
      window.Amplify.configure(awsconfig);
    }
    const Auth = window.Amplify?.Auth;
    const apiEndpoint = awsconfig.aws_cloud_logic_custom[0].endpoint;

    // ——— Leer y agrupar carrito ———
    const raw = JSON.parse(localStorage.getItem('cart') || '[]');
    const items = raw.reduce((acc, p) => {
      const found = acc.find(x => x.productId === p.productId);
      if (found) found.quantity += 1;
      else acc.push({ ...p, quantity: 1 });
      return acc;
    }, []);

    // ——— Renderizar resumen ———
    const listEl   = document.getElementById('checkout-summary-list');
    const countEl  = document.getElementById('checkout-summary-count');
    const totalEl  = document.getElementById('checkout-summary-total');
    let sumQty = 0, sumPrice = 0;
    listEl.innerHTML = '';
    if (!items.length) {
      listEl.innerHTML = '<li>Tu carrito está vacío.</li>';
    } else {
      items.forEach(p => {
        const sub = p.price * p.quantity;
        sumQty   += p.quantity;
        sumPrice += sub;
        listEl.insertAdjacentHTML('beforeend', `
          <li>
            <span>${p.name} x${p.quantity}</span>
            <span>€${sub.toFixed(2)}</span>
          </li>
        `);
      });
    }
    countEl.textContent = sumQty;
    totalEl.textContent = sumPrice.toFixed(2);

    // ——— Envío de pedido ———
    const btn = document.getElementById('place-order-btn');
    if (btn) {
      btn.addEventListener('click', async () => {
        // Agarrar los inputs y validar que existan
        const firstNameEl = document.getElementById('firstName');
        const lastNameEl  = document.getElementById('lastName');
        const emailEl     = document.getElementById('email');
        const addressEl   = document.getElementById('address');
        const postalEl    = document.getElementById('postalCode');
        const localityEl  = document.getElementById('locality');
        const phoneEl     = document.getElementById('phone');

        if (![firstNameEl,lastNameEl,emailEl,addressEl,postalEl,localityEl,phoneEl].every(e=>e)) {
          console.error('Faltan campos del formulario', {
            firstNameEl,lastNameEl,emailEl,addressEl,postalEl,localityEl,phoneEl
          });
          return alert('Error: faltan campos del formulario.');
        }

        const billing = {
          firstName:  firstNameEl.value.trim(),
          lastName:   lastNameEl.value.trim(),
          email:      emailEl.value.trim(),
          address:    addressEl.value.trim(),
          postalCode: postalEl.value.trim(),
          locality:   localityEl.value.trim(),
          phone:      phoneEl.value.trim()
        };

        const payload = { total: sumPrice, items, billing };
        const headers = { 'Content-Type': 'application/json' };

        // Intentar añadir token si existe sesión
        try {
          if (Auth) {
            const user  = await Auth.currentAuthenticatedUser();
            const token = user.signInUserSession.idToken.jwtToken;
            headers.Authorization = `Bearer ${token}`;
          }
        } catch { console.warn('Usuario no autenticado'); }

        // Llamada a la API
        try {
          const res  = await fetch(`${apiEndpoint}/orders`, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload)
          });
          const text = await res.text();
          console.log('API /orders status:', res.status, 'response:', text);

          const data = (() => {
            try { return JSON.parse(text); }
            catch { return { error: text }; }
          })();

          if (res.ok) {
            alert('Pedido realizado: ' + data.orderId);
            localStorage.removeItem('cart');
            window.location.href = 'account.html';
          } else {
            throw new Error(data.error || res.statusText);
          }
        } catch (e) {
          console.error('Error enviando pedido:', e);
          alert('Error al generar el pedido:\n' + e.message);
        }
      });
    }
  });
  </script>
</body>
</html>
