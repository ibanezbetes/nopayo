<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--=============== FAVICON ===============-->
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
  <!--=============== REMIXICONS ===============-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.0.1/remixicon.min.css" />
  <!--=============== ESTILOS ===============-->
  <link rel="stylesheet" href="assets/css/styles.css" />
  <title>Nopayo — Checkout</title>
  <style>
    .main { padding-top: calc(var(--header-height) + 2rem); }
    .checkout { padding-block: 4rem 2rem; background: var(--first-color); color: var(--black-color); }
    .checkout__container { display: grid; grid-template-columns: repeat(2,1fr); gap:2rem; }
    .checkout__title { font-family: var(--body-font); font-weight: var(--font-semi-bold); color: var(--accent-color); text-align:center; font-size: var(--h2-font-size); margin-bottom:2rem; }
    .checkout__card { background: var(--accent-color); padding:1.5rem; border-radius:8px; }
    .checkout__summary h2, .checkout__form h2 { font-family: var(--body-font); font-weight: var(--font-semi-bold); color: var(--first-color); margin-bottom:1rem; }
    .checkout__summary ul { list-style:none; margin:0; padding:0; }
    .checkout__summary li { display:flex; justify-content:space-between; margin-bottom:1rem; border-bottom:1px solid rgba(0,0,0,0.1); padding-bottom:0.5rem; }
    .checkout__summary .total { font-weight:var(--font-semi-bold); font-size:var(--h3-font-size); margin-top:1rem; display:flex; justify-content:space-between; }
    .checkout__form .form-group { margin-bottom:1rem; }
    .checkout__form label { display:block; margin-bottom:0.5rem; font-weight:var(--font-semi-bold); font-family:var(--body-font); color:var(--black-color); }
    .checkout__form input { width:100%; padding:0.75rem 1rem; border:1px solid rgba(0,0,0,0.1); border-radius:4px; font-family:var(--body-font); font-size:var(--normal-font-size); }
    .checkout__form .checkbox-group { display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem; }
    .checkout__actions { grid-column:1/-1; display:flex; justify-content:center; margin-top:2rem; }
    .btn-order { background: var(--first-color); color: var(--accent-color); border:none; padding:0.75rem 1.5rem; border-radius:4px; font-family:var(--body-font); font-weight:var(--font-semi-bold); cursor:pointer; transition: background-color .3s; }
    .btn-order:hover { background: var(--first-color-lighten); }
    @media(max-width:1150px){ .checkout__container { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo"><img src="images/logo.png" alt="NOPAYO — Inicio"/></a>
      <div class="nav__menu" id="nav-menu">…</div>
      <div class="nav__actions"><a href="cart.html"><i class="ri-shopping-cart-line"></i></a><div class="nav__toggle" id="nav-toggle"><i class="ri-menu-line"></i></div></div>
    </nav>
  </header>

  <!-- Main -->
  <main class="main">
    <section class="checkout">
      <h1 class="checkout__title">Proceso de Pedido</h1>
      <div class="checkout__container container">
        <!-- Resumen de carrito -->
        <div class="checkout__card checkout__summary">
          <h2>Tu carrito (<span id="checkout-summary-count">0</span>)</h2>
          <ul id="checkout-summary-list"></ul>
          <div class="total"><span>Total</span><span>€<span id="checkout-summary-total">0.00</span></span></div>
        </div>
        <!-- Dirección de facturación -->
        <div class="checkout__card checkout__form">
          <h2>Dirección de Facturación</h2>
          <div class="form-group"><label for="firstName">Nombre</label><input type="text" id="firstName" required/></div>
          <div class="form-group"><label for="lastName">Apellidos</label><input type="text" id="lastName" required/></div>
          <div class="form-group"><label for="email">Email</label><input type="email" id="email" required/></div>
          <div class="form-group"><label for="address">Dirección</label><input type="text" id="address" required/></div>
          <div class="form-group"><label for="postalCode">Código Postal</label><input type="text" id="postalCode" required/></div>
          <div class="form-group"><label for="locality">Localidad</label><input type="text" id="locality" required/></div>
          <div class="form-group"><label for="phone">Teléfono</label><input type="tel" id="phone" required/></div>
          <div class="checkbox-group"><input type="checkbox" id="sameAddress" checked/><label for="sameAddress">La dirección de envío es igual</label></div>
        </div>
        <!-- Botón de crear pedido -->
        <div class="checkout__actions"><button class="btn-order" id="place-order-btn">Realizar Pedido</button></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="home__footer">…</footer>

  <!-- AWS Amplify CDN -->
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@4.4.4/dist/aws-amplify.min.js"></script>
  <script>
    // Inline AWS config
    const awsconfig = {
      aws_cognito_region: "us-east-1",
      aws_user_pools_id: "us-east-1_RiJ4pDIaa",
      aws_user_pools_web_client_id: "6l7mg3kafjuugr1op4f83j8udv",
      aws_cloud_logic_custom: [
        { name: "ordersApi", endpoint: "https://xi7qwmpqs1.execute-api.us-east-1.amazonaws.com/dev", region: "us-east-1" }
      ]
    };
    window.Amplify.configure(awsconfig);
    const Auth = window.Amplify.Auth;
    const apiEndpoint = awsconfig.aws_cloud_logic_custom[0].endpoint;
    console.log('Usando endpoint API:', apiEndpoint);

    document.addEventListener('DOMContentLoaded', async () => {
      const storedCart = localStorage.getItem('cart') || localStorage.getItem('cartItems') || localStorage.getItem('cartItemsList');
      console.log('Stored cart raw:', storedCart);
      const cart = storedCart ? JSON.parse(storedCart) : [];
      console.log('Cart:', cart);
      const list = document.getElementById('checkout-summary-list');
      const count = document.getElementById('checkout-summary-count');
      const totalEl = document.getElementById('checkout-summary-total');
      list.innerHTML = '';
      let sumQty = 0, sumTotal = 0;

      if (!cart.length) {
        list.innerHTML = '<li>Tu carrito está vacío.</li>';
      } else {
        cart.forEach(item => {
          sumQty += item.quantity;
          sumTotal += item.price * item.quantity;
          const li = document.createElement('li');
          li.innerHTML = `<span>${item.name} x${item.quantity}</span><span>€${(item.price * item.quantity).toFixed(2)}</span>`;
          list.appendChild(li);
        });
      }
      count.textContent = sumQty;
      totalEl.textContent = sumTotal.toFixed(2);

      document.getElementById('place-order-btn').addEventListener('click', async () => {
        const billing = {
          firstName: document.getElementById('firstName').value,
          lastName: document.getElementById('lastName').value,
          email: document.getElementById('email').value,
          address: document.getElementById('address').value,
          postalCode: document.getElementById('postalCode').value,
          locality: document.getElementById('locality').value,
          phone: document.getElementById('phone').value
        };
        const payload = { total: sumTotal, items: cart, billing };
        const headers = { 'Content-Type': 'application/json' };
        try {
          const user = await Auth.currentAuthenticatedUser();
          const token = user.signInUserSession.idToken.jwtToken;
          headers.Authorization = `Bearer ${token}`;
        } catch {}

        try {
          const res = await fetch(`${apiEndpoint}/orders`, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            alert('Pedido realizado: ' + data.orderId);
            localStorage.removeItem('cart');
            window.location.href = 'account.html';
          } else {
            throw new Error(data.error);
          }
        } catch (e) {
          console.error(e);
          alert('Error al generar el pedido');
        }
      });
    });
  </script>
  <script src="assets/js/menu.js"></script>
</body>
</html>
